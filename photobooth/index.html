<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141110">
<title>Photo wall</title>
<meta name="description" content="Visitors' augmented reality photos from the museum, shared with their permission.">
<link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="./wall.css">
<script src="../js/config.js"></script>
<script src="../js/cloud/config.js"></script>
<script type="module" src="./wall.js"></script>
</head>
<body>
<div class="wall" id="wall">
  <header class="wall-head">
    <div class="wall-title">
      <span class="wall-lamp" aria-hidden="true"></span>
      <div>
        <p class="wall-eyebrow" id="wallMuseum">IBN AR Museum</p>
        <h1 id="wallTitle">Our photo wall</h1>
      </div>
    </div>
    <p class="wall-note" id="wallNote">Photos taken with the AR guide, shared by the people in them.</p>
    <div class="wall-take">
      <div class="wall-qr" id="wallQr" aria-hidden="true"></div>
      <div>
        <strong>Take yours</strong>
        <span>Scan, point your phone at a painting, and stand next to its figure.</span>
      </div>
    </div>
  </header>

  <main class="wall-body">
    <section class="wall-hero" id="wallHero" aria-live="polite">
      <div class="wall-empty" id="wallEmpty">
        <div class="wall-spinner"></div>
        <p>Waiting for the first photo…</p>
      </div>
    </section>
    <section class="wall-grid" id="wallGrid" aria-label="Latest photos"></section>
  </main>

  <button class="wall-full" id="wallFull" type="button" aria-label="Full screen" title="Full screen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
</body>
</html>
